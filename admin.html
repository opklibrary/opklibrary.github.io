<!DOCTYPE html>
<html lang="en">

<head>

    <!-- =========================
         PAGE INFORMATION
         ========================= -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>OPK Tech Help Administration</title>
    
    <link rel="icon" type="image/png" href="logo.png">
    
    <!-- Same stylesheet as main page -->
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- =========================
         PAGE HEADER
         ========================= -->

    <header class="page-header">

        <!-- Clickable library logo -->
        <a href="https://opklibrary.github.io/"
           target="_blank"
           rel="noopener noreferrer">

            <img src="logo.png"
                 alt="Orchard Park Library Logo"
                 class="logo">

        </a>

        <div class="header-text">

            <h1>Orchard Park Library Tech Help</h1>

        </div>

    </header>


    <!-- =========================
         PAGE INTRODUCTION
         ========================= -->

    <div class="intro">

        <h2>Appointment Administration</h2>

        <p>
            View and manage upcoming Tech Help appointments.
        </p>

    </div>


    <!-- =========================
         MAIN CONTENT
         ========================= -->

    <main class="container">


        <!-- =========================
             SEARCH (Future Feature)
             ========================= -->

        <div class="form-section">

            <label for="searchAppointments">
                Search by Any Field
            </label>

            <input
                type="text"
                id="searchAppointments"
                placeholder="Search appointments...">

        </div>


      <!-- =========================
             FILTER BUTTONS
             ========================= -->

<div class="admin-view-buttons">

    <button id="showUpcoming" class="active-view">
        Upcoming Appointments
    </button>

    <button id="showPast">
        Past Dates
    </button>

    <button id="showCanceled">
        Canceled Appointments
    </button>

</div>

<h2 id="adminViewTitle" class="admin-view-title">
    Upcoming Appointments
</h2>

</div>


        <!-- =========================
             APPOINTMENTS LIST
             JavaScript will fill this in.
             ========================= -->

        <div id="appointmentList">

            <!-- Example:

            July 30

            9:00 AM

            Amanda

            ...

            -->

        </div>


    </main>
    
<!-- =========================
     RESCHEDULE MODAL
========================= -->

<div id="rescheduleModal" class="reschedule-modal">

    <div class="reschedule-box">

        <h2>Reschedule Appointment</h2>

        <p id="rescheduleCurrentAppointment"></p>

        <label for="rescheduleSlot">
            Choose a new appointment:
        </label>

        <select id="rescheduleSlot">
            <option value="">Select an available appointment</option>
        </select>

        <div class="reschedule-actions">

            <button id="confirmReschedule">
                Reschedule
            </button>

            <button id="cancelReschedule">
                Cancel
            </button>

        </div>

    </div>

</div>
    

    <!-- =========================
         JAVASCRIPT
         ========================= -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="admin.js"></script>

</body>

</html>
