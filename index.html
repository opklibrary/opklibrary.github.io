<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Page information -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Browser tab title -->
    <title>Appointment Scheduler</title>

    <!-- Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
    
<body>

    <!-- =========================
         PAGE HEADER
         ========================= -->
    <header class="page-header"> 

        <!-- Library logo (clickable) -->
        <a href="https://buffalolib.org/"
            target="_blank"
            rel="noopener noreferrer">
                <img src="logo.png" alt="Orchard Park Library Logo" class="logo">
        </a>

        <!-- Page title and instructions -->
        <div class="header-text">
            <h1>Orchard Park Library Tech Help</h1>
            
            <h2>Please Pick an Appointment Time</h2>
            
            <p> You may only pick one appointment time, one appointment per person. </p>
            
            <p> Appointments are for one hour only.</p>
        </div>

    </header>

    <!-- =========================
         MAIN PAGE CONTENT
         ========================= -->
    <main class="container">

        <!-- Appointment times generated by JavaScript -->
        <div id="dates" class="date-grid"></div>

        <!-- =========================
             USER INFORMATION FORM
             (Add name, email, phone, etc. here)
             ========================= -->

        <!-- Future form fields go here -->


        <!-- =========================
             REASON FOR APPOINTMENT
             (Checkboxes and description)
             ========================= -->

        <!-- Future reason-for-appointment form goes here -->


        <!-- =========================
             SUBMIT BUTTON
             ========================= -->
        <button id="submitAppointment">
            Submit Appointment
        </button>

    </main>

    <!-- =========================
         JAVASCRIPT FILES
         ========================= -->

    <!-- Supabase library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Your custom JavaScript -->
    <script src="script.js"></script>

</body>
</html>
