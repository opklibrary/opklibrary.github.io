<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Page information -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Browser tab title -->
    <title>Appointment Scheduler</title>

    <!-- Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
    
<body>

    <!-- =========================
         PAGE HEADER
         ========================= -->
    <header class="page-header"> 

        <!-- Library logo (clickable) -->
        <a href="https://buffalolib.org/"
            target="_blank"
            rel="noopener noreferrer">
                <img src="logo.png" alt="Orchard Park Library Logo" class="logo">
        </a>

        <!-- Page title and instructions -->
        <div class="header-text">
            <h1>Orchard Park Library Tech Help</h1>
        </header>
    
    <div class="intro">
            <h2>Please Pick an Appointment Time</h2>
            <p> You may only pick one appointment time, one appointment per person. </p>
            <p> Appointments are for one hour only.</p>
        </div>

  

    <!-- =========================
         MAIN PAGE CONTENT
         ========================= -->
    <main class="container">

        <!-- Appointment times generated by JavaScript -->
        <div id="dates" class="date-grid"></div>

        <!-- =========================
             USER INFORMATION FORM
             (Add name, email, phone, etc. here)
             ========================= -->
        <div class="form-section">
        
            <h2>Your Information</h2>
            
            <div class="form-group">
                <label for="name">Full Name *</label>
                <input type="text" id="name" required>
            </div>
            
            <div class="form-group">
                <label for="email">Email Address *</label>
                <input type="email" id="email" required>
            </div>
            
            <div class="form-group">
                <label for="phone">Phone Number *</label>
                <input type="tel" id="phone" required>
            </div>
            
            <div class="form-group">
                <label for="whatTech">What technology are you bringing?</label>
                <input
                    type="text"
                    id="whatTech"
                    placeholder="Laptop, iPhone, Kindle, etc.">
            </div>

        </div>
            
        <!-- =========================
             REASON FOR APPOINTMENT
             (Radio buttons and description)
             ========================= -->
        <div class="form-section">
            
            <h2>Reason for Appointment</h2>
    
            <div class="reason-options">
            
                <label>
                    <input type="radio" name="reason" id="learn" value="learn">
                    Learn something new
                </label>
            
                <label>
                    <input type="radio" name="reason" id="need" value="need">
                    Need help using a device
                </label>
            
                <label>
                    <input type="radio" name="reason" id="new" value="new">
                    Set up a new device
                </label>
            
                <label>
                    <input type="radio" name="reason" id="help" value="help">
                    General tech help
                </label>
            
                <label>
                    <input type="radio" name="reason" id="other" value="other">
                    Other
                </label>
            
            </div>
                
            <div class="form-group">
            
                <label for="describeProblem">
                    Describe your problem
                </label>
            
                <textarea
                    id="describeProblem"
                    rows="5"
                    placeholder="Tell us how we can help...">
                </textarea>
            
            </div>

        </div>

        <!-- =========================
             SUBMIT BUTTON
             ========================= -->
        <div class="confirmation">
    <label>
        <input type="checkbox" id="agreement">
        I understand that selecting an appointment time does not guarantee my appointment until it has been confirmed.
    </label>
</div>
        <button id="submitAppointment">
            Submit Appointment
        </button>

    </main>

    <!-- =========================
         JAVASCRIPT FILES
         ========================= -->

    <!-- Supabase library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Your custom JavaScript -->
    <script src="script.js"></script>

</body>
</html>
