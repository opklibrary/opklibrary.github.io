<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointment Scheduler</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="page-header">

        <div class="header-text">
            <h1>Orchard Park Library Tech Help</h1>
            <h2>Please Pick an Appointment Time</h2>
            <p>Select an available appointment time below. You may only select one appointment at a time. Appointments are only one hour.</p>
        </div>

    </header>

    <main class="container">

        <div id="dates" class="date-grid"></div>

        <button id="submitAppointment">Submit Appointment</button>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>

</body>
</html>
